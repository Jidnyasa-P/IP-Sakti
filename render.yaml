# Render Blueprint — deploys all 3 services together (Render free tier).
# Put this file at the REPO ROOT (same level as frontend/, server/, ip_sakti_rag/).
# Then: Render dashboard -> New -> Blueprint -> point at this repo.
# You'll still need to fill in the secret env vars marked `sync: false`
# in the Render dashboard after the blueprint creates the services.

services:
  - type: web
    name: ip-sakti-rag
    runtime: python
    plan: free
    rootDir: ip_sakti_rag
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gemini-2.0-flash
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION
        value: ip_sakti_chunks
      - key: NEO4J_ENABLED
        value: "false"
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USERNAME
        value: neo4j
      - key: NEO4J_PASSWORD
        sync: false
      - key: TRANSLATION_PROVIDER
        value: none
      - key: BHASHINI_API_KEY
        sync: false
      - key: BHASHINI_USER_ID
        sync: false
      - key: RAG_SERVICE_SHARED_SECRET
        generateValue: true

  - type: web
    name: ip-sakti-backend
    runtime: node
    plan: free
    rootDir: .
    buildCommand: "npm install && npm run build"
    startCommand: "npm start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: LLM_API_KEY
        sync: false
      - key: RAG_SERVICE_URL
        fromService:
          type: web
          name: ip-sakti-rag
          property: hostport
      - key: RAG_SERVICE_SHARED_SECRET
        fromService:
          type: web
          name: ip-sakti-rag
          envVarKey: RAG_SERVICE_SHARED_SECRET

  - type: web
    name: ip-sakti-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: ip-sakti-backend
          property: hostport
