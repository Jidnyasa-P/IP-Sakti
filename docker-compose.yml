# IP-SAKTI Sahayak — Docker Compose
#
# Minimal path (no external services, DEMO MODE — dummy/local data, no keys needed):
#   docker compose up app
#   -> open http://localhost:8000
#
# Full path with live Qdrant + Neo4j + MongoDB (edit .env first — see .env.example):
#   docker compose --profile full-stack up
#
version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - FRONTEND_ORIGIN=http://localhost:8000
      - LLM_API_KEY=${LLM_API_KEY:-}
      - QDRANT_URL=${QDRANT_URL:-}
      - NEO4J_URI=${NEO4J_URI:-}
      - MONGODB_URI=${MONGODB_URI:-}
      - BHASHINI_API_KEY=${BHASHINI_API_KEY:-}
      - BHASHINI_USER_ID=${BHASHINI_USER_ID:-}
    volumes:
      - backend_data:/app/data
    restart: unless-stopped

  # --- Optional live services. Not required for the demo (DEMO MODE covers everything). ---
  qdrant:
    image: qdrant/qdrant:v1.7.4
    profiles: ["full-stack"]
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  neo4j:
    image: neo4j:5.24
    profiles: ["full-stack"]
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/change-me-in-production
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

  mongodb:
    image: mongo:6.0
    profiles: ["full-stack"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  backend_data:
  qdrant_storage:
  neo4j_data:
  mongo_data:
