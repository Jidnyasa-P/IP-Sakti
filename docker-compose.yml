version: '3.8'

services:
  # IP-SAKTI Sahayak Full-Stack Web Application (Node / Express + Vite React)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - MONGODB_URI=mongodb://mongodb:27017/ipsakti
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      - mongodb
      - qdrant
    restart: unless-stopped

  # Qdrant Vector Database for Semantic Retrieval
  qdrant:
    image: qdrant/qdrant:v1.7.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  # MongoDB for Users, Conversations, Products & Document Metadata
  mongodb:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  qdrant_storage:
  mongo_data:
